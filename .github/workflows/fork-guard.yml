name: fork-guard
on: pull_request
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 默认检出的是 GitHub 合成的 refs/pull/N/merge，其第二父是 PR 分支 tip，
          # 会让同步模式的基准推导取到分支 tip → 差集近乎为空 → 边界检查空转恒绿。
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 同步分支合完上游后三点差集等于全量上游改动，用增量模式会把同步 PR 自己判红；
      # 故按分支名分流。推导失败硬失败退出，不回落增量模式（静默降级 = 不做检查）。
      - name: Fork boundary check
        run: |
          if [[ "${{ github.head_ref }}" == feat/upstream-sync-* ]]; then
            FORK_SYNC_MODE=1 FORK_BASE_REF=${{ github.base_ref }} node scripts/check-fork-boundary.mjs
          else
            FORK_DIFF_BASE=origin/${{ github.base_ref }} node scripts/check-fork-boundary.mjs
          fi
      - name: Fork brand check
        run: node scripts/check-fork-brand.mjs
      # free-api.test.ts 打真实外部翻译服务，端点抖动或限流会让构建门红在与本仓改动
      # 无关的地方。与 release.yml 同样用 SKIP_FREE_API 跳过——而不是 --exclude glob：
      # glob 只挡住这一个文件名，日后新增的实机冒烟测试仍会真打网络。
      - run: pnpm run test
        env:
          SKIP_FREE_API: "true"
      # 国内线：三个浏览器目标各构建一次，顺带验证三端都还能编译——这是单渠道打包给不了的覆盖面。
      - run: pnpm run build
      - run: pnpm run build:edge
      - run: pnpm run build:firefox
      # 逐个产物目录都断言。此前只跑一次、默认读 .output/chrome-mv3，edge / firefox 白构建从没被验过。
      - name: Assert bundle domains (cn, all targets)
        run: |
          for browser in chrome edge firefox; do
            echo "── asserting .output/$browser-mv3"
            FORK_OUT_DIR=".output/$browser-mv3" node scripts/assert-fork-build.mjs
          done
      # 海外线：走 pack.mjs 真跑一次正式出包，而不是在这里重写一遍 env 注入——
      # 抄一份注入逻辑到 YAML，两边漂移时 CI 绿而真实打包红，护栏就变成了噪音。
      # 只打一个代表渠道：同 edition 的渠道之间只差一个号码，配置错误一个就能暴露，打满 4 个是纯浪费。
      # pack.mjs 内部已串好「读该线配置 → 注入 → wxt zip → assert-fork-build（带 edition 与产物目录）」。
      - name: Global edition build + assert
        run: node scripts/pack.mjs store --edition global --channel global-zip
