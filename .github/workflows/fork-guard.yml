name: fork-guard
on:
  pull_request:
    branches: [main]
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fork boundary check
        run: FORK_DIFF_BASE=origin/${{ github.base_ref }} node scripts/check-fork-boundary.mjs
      - name: Fork brand check
        run: node scripts/check-fork-brand.mjs
      # free-api.test.ts 打真实外部翻译服务，端点抖动或限流会让构建门红在与本仓改动
      # 无关的地方。与 release.yml 同样用 SKIP_FREE_API 跳过——而不是 --exclude glob：
      # glob 只挡住这一个文件名，日后新增的实机冒烟测试仍会真打网络。
      - run: pnpm run test
        env:
          SKIP_FREE_API: "true"
      - run: pnpm run build
      - run: pnpm run build:edge
      - run: pnpm run build:firefox
      - name: Assert no upstream domains in bundle
        run: node scripts/assert-fork-build.mjs
