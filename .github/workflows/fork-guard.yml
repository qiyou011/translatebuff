name: fork-guard
on: pull_request
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 默认检出的是 GitHub 合成的 refs/pull/N/merge，其第二父是 PR 分支 tip，
          # 会让同步模式的基准推导取到分支 tip → 差集近乎为空 → 边界检查空转恒绿。
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 同步分支合完上游后三点差集等于全量上游改动，用增量模式会把同步 PR 自己判红；
      # 故按分支名分流。推导失败硬失败退出，不回落增量模式（静默降级 = 不做检查）。
      - name: Fork boundary check
        run: |
          if [[ "${{ github.head_ref }}" == feat/upstream-sync-* ]]; then
            FORK_SYNC_MODE=1 FORK_BASE_REF=${{ github.base_ref }} node scripts/check-fork-boundary.mjs
          else
            FORK_DIFF_BASE=origin/${{ github.base_ref }} node scripts/check-fork-boundary.mjs
          fi
      - name: Fork brand check
        run: node scripts/check-fork-brand.mjs
      # free-api.test.ts 打真实外部翻译服务，端点抖动或限流会让构建门红在与本仓改动
      # 无关的地方。与 release.yml 同样用 SKIP_FREE_API 跳过——而不是 --exclude glob：
      # glob 只挡住这一个文件名，日后新增的实机冒烟测试仍会真打网络。
      - run: pnpm run test
        env:
          SKIP_FREE_API: "true"
      - run: pnpm run build
      - run: pnpm run build:edge
      - run: pnpm run build:firefox
      - name: Assert no upstream domains in bundle
        run: node scripts/assert-fork-build.mjs
